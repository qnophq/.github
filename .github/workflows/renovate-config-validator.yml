# SPDX-License-Identifier: AGPL-3.0-only
#
# Validates default.json on every push and PR.
#
# Why: a syntactically broken org-wide Renovate config silently disables
# dependency updates across every repo in the org. We want that caught at
# PR time, not on the next scheduled Renovate run.
#
# Tool: Renovate's own `renovate-config-validator` invoked via npx with
# the `--strict` flag (warnings become errors). The validator ships in the
# renovate npm package, so the same binary that runs in production
# evaluates the schema here.
#
# Security note: this workflow takes no event-payload input into any `run:`
# step — only static literal arguments — so the workflow-injection class of
# vulnerabilities does not apply.

name: Renovate config validator

on:
  push:
    branches: [main]
    paths:
      - "default.json"
      - ".github/workflows/renovate-config-validator.yml"
  pull_request:
    paths:
      - "default.json"
      - ".github/workflows/renovate-config-validator.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Validate default.json
        run: npx --yes --package renovate -- renovate-config-validator --strict default.json

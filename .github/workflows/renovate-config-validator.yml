# SPDX-License-Identifier: AGPL-3.0-only
#
# Validates this repo's Renovate configs on every push and PR.
#
# Two files, two blast radii: default.json is the org-wide preset, so a
# syntactically broken one silently disables dependency updates across
# every repo in the org; .github/renovate.json only governs this repo. We
# want both caught at PR time, not on the next scheduled Renovate run.
#
# Tool: Renovate's own `renovate-config-validator` invoked via npx with
# the `--strict` flag (warnings become errors). The validator ships in the
# renovate npm package, so the same binary that runs in production
# evaluates the schema here.
#
# Security note: this workflow takes no event-payload input into any `run:`
# step — only static literal arguments — so the workflow-injection class of
# vulnerabilities does not apply.

name: Renovate config validator

on:
  push:
    branches: [main]
    paths:
      - "default.json"
      - ".github/renovate.json"
      - ".github/workflows/renovate-config-validator.yml"
  pull_request:
    paths:
      - "default.json"
      - ".github/renovate.json"
      - ".github/workflows/renovate-config-validator.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      # Both files in one invocation: the validator takes several paths and
      # fails the step if any of them is invalid.
      - name: Validate the Renovate configs
        run: npx --yes --package renovate -- renovate-config-validator --strict default.json .github/renovate.json
